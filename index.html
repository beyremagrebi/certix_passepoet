<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>certix_passport</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
<script>
  (function () {
    try {
      var theme = localStorage.getItem("theme-mode") || "system";
      var palette = localStorage.getItem("color-palette") || "indigo";

      if (theme !== "light" && theme !== "dark" && theme !== "system") {
        theme = "system";
      }

      var validPalettes = [
        "indigo",
        "blue",
        "emerald",
        "violet",
        "rose",
        "orange",
      ];

      if (!validPalettes.includes(palette)) {
        palette = "indigo";
      }

      var resolvedTheme =
        theme === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : theme;

      document.documentElement.dataset.theme = resolvedTheme;
      document.documentElement.dataset.palette = palette;
      document.documentElement.style.colorScheme = resolvedTheme;
    } catch (error) {
      document.documentElement.dataset.theme = "light";
      document.documentElement.dataset.palette = "indigo";
    }
  })();
</script>
  </body>
</html>
